<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para você</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=Nunito:wght@500;600&display=swap">
<style>
:root{
  --bg1:#f8e9e5; --bg2:#efd1d2; --ink:#6a3744; --rose:#c9798f; --deep:#a94d69;
  --card:rgba(255,249,246,.85); --line:rgba(169,77,105,.28); --petal:rgba(214,134,155,.55);
  --fim1:#f1cdd2; --fim2:#e2a5b5;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg1:#3b2229;--bg2:#4e2c37;--ink:#f7e1e4;--rose:#e29aae;--deep:#f0b3c1;--card:rgba(72,40,50,.8);--line:rgba(240,179,193,.3);--petal:rgba(226,154,174,.4);--fim1:#5a3140;--fim2:#7a4256}
}
:root[data-theme="dark"]{--bg1:#3b2229;--bg2:#4e2c37;--ink:#f7e1e4;--rose:#e29aae;--deep:#f0b3c1;--card:rgba(72,40,50,.8);--line:rgba(240,179,193,.3);--petal:rgba(226,154,174,.4);--fim1:#5a3140;--fim2:#7a4256}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg1);scroll-padding-top:env(safe-area-inset-top,0px)}
body{min-height:100%;background:linear-gradient(165deg,var(--bg1),var(--bg2));color:var(--ink);font-family:"Cormorant Garamond",Georgia,serif;overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:2px solid var(--deep);outline-offset:4px;border-radius:12px}

.petal{position:fixed;top:-40px;width:14px;height:18px;background:var(--petal);border-radius:150% 0 150% 0;pointer-events:none;z-index:0;animation:fall linear infinite}
@keyframes fall{to{transform:translate(var(--dx),112vh) rotate(var(--rot))}}

.scene{position:relative;z-index:1;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem 1rem;text-align:center;transition:opacity .7s ease}
.scene.out{opacity:0;pointer-events:none}
h1{font-style:italic;font-weight:600;font-size:clamp(2rem,8vw,3.2rem);line-height:1.1;letter-spacing:.01em;max-width:14em;color:var(--deep)}

.carrossel{display:flex;align-items:center;justify-content:center;gap:.4rem;margin-top:1.4rem;width:100%;max-width:520px}
.nav{flex:none;width:46px;height:46px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--deep);box-shadow:0 4px 14px rgba(150,70,95,.15);transition:transform .2s}
.nav:active{transform:scale(.92)}
.nav svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.flor{flex:1;max-width:320px;aspect-ratio:1;display:grid;place-items:center;border-radius:50%}
.flor svg{width:100%;height:100%;filter:drop-shadow(0 10px 14px rgba(150,70,95,.28));animation:balanca 7s ease-in-out infinite}
.flor.in svg{animation:entra .6s ease both,balanca 7s ease-in-out .6s infinite}
.flor.inb svg{animation:entrab .6s ease both,balanca 7s ease-in-out .6s infinite}
.flor.flo svg{animation:flo .7s ease both,balanca 7s ease-in-out .7s infinite}
@keyframes balanca{50%{transform:rotate(3deg)}}
@keyframes entra{from{opacity:0;transform:translateX(40px) scale(.85) rotate(12deg)}}
@keyframes entrab{from{opacity:0;transform:translateX(-40px) scale(.85) rotate(-12deg)}}
@keyframes flo{40%{transform:scale(1.1) rotate(8deg)}}

.dots{display:flex;gap:.55rem;margin-top:.6rem}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--rose);opacity:.35;transition:.3s}
.dots i.on{opacity:1;transform:scale(1.3)}
.dica{margin-top:.8rem;font-style:italic;font-size:1.1rem;opacity:.75}

.card{position:relative;margin-top:3.2rem;max-width:480px;width:100%;padding:2.6rem 1.5rem 1.6rem;background:var(--card);border:1px solid var(--line);border-radius:28px 28px 28px 8px;box-shadow:0 14px 34px rgba(150,70,95,.18);backdrop-filter:blur(6px)}
.card:not([hidden]){animation:sobe .7s ease both}
@keyframes sobe{from{opacity:0;transform:translateY(16px)}}
.card::after{content:"";position:absolute;inset:7px;border:1px dashed var(--line);border-radius:22px 22px 22px 4px;pointer-events:none}
.mini{position:absolute;left:50%;top:-38px;width:76px;height:76px;margin-left:-38px;border-radius:50%;background:var(--card);border:1px solid var(--line);padding:4px}
.mini svg{width:100%;height:100%}
.t{font-style:italic;font-weight:500;font-size:clamp(1.4rem,5.4vw,1.75rem);line-height:1.35}
.q{margin-top:1.1rem;font-size:1.25rem;color:var(--deep);font-style:italic;font-weight:600}
.go{margin-top:1rem;padding:.8rem 2.2rem;border-radius:999px;background:linear-gradient(135deg,#d98fa3,var(--deep));color:#fff;font-family:Nunito,system-ui,sans-serif;font-weight:600;letter-spacing:.04em;box-shadow:0 8px 18px rgba(169,77,105,.35);min-height:48px;transition:transform .2s}
.go:active{transform:scale(.95)}

#final{position:fixed;inset:0;z-index:2;display:grid;place-items:center;padding:calc(1rem + env(safe-area-inset-top,0px)) 1rem calc(1rem + env(safe-area-inset-bottom,0px));background:radial-gradient(circle at 50% 40%,var(--fim1),var(--fim2));opacity:0;visibility:hidden;transition:opacity 1.2s ease,visibility 0s 1.2s}
#final.on{opacity:1;visibility:visible;transition:opacity 1.2s ease}
.coracao{width:min(94vw,520px,calc(86svh*1.116));aspect-ratio:212/190;animation:bate 2.4s ease-in-out infinite;filter:drop-shadow(0 16px 24px rgba(120,40,70,.35))}
.coracao svg{width:100%;height:100%;display:block}
@keyframes bate{0%,100%{transform:scale(1)}12%{transform:scale(1.045)}24%{transform:scale(1)}36%{transform:scale(1.03)}}
.dicaf{font-family:Nunito,sans-serif;font-size:7.5px;font-weight:600;fill:#a94d69}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body>

<main class="scene" id="main">
  <h1>Clique nas flores a seguir</h1>
  <div class="carrossel">
    <button class="nav" id="volta" aria-label="Flor anterior"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="flor" id="flor"></button>
    <button class="nav" id="avanca" aria-label="Próxima flor"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
  <div class="dots" id="dots"></div>
  <p class="dica" id="dica">toque na flor</p>
  <section class="card" id="card" hidden aria-live="polite"></section>
</main>

<section id="final" aria-hidden="true">
  <div class="coracao" id="coracao" role="img" aria-label="Coração com foto">
    <svg viewBox="-6 -6 212 190">
      <defs>
        <clipPath id="hc"><path id="hp" d="M100 170C20 110 0 70 0 45C0 18 20 0 47 0C70 0 90 12 100 32C110 12 130 0 153 0C180 0 200 18 200 45C200 70 180 110 100 170Z"/></clipPath>
        <clipPath id="fc"><rect id="fcr" rx="7"/></clipPath>
        <linearGradient id="hg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7cdd6"/><stop offset="1" stop-color="#d98aa0"/></linearGradient>
      </defs>
      <use href="#hp" fill="url(#hg)"/>
      
      <image id="foto" preserveAspectRatio="xMidYMid meet" style="display:none"/>
      <use href="#hp" fill="none" stroke="#fff" stroke-opacity=".85" stroke-width="3"/>
    </svg>
  </div>
</section>

/* ==================== fim da configuração ==================== */

/* ---------- Flores desenhadas em SVG ---------- */
const P = (d,n,sc,rot,fill,st='rgba(120,45,70,.2)') =>
  Array.from({length:n},(_,i)=>`<path d="${d}" transform="rotate(${rot+i*360/n}) scale(${sc})" fill="${fill}" stroke="${st}" stroke-width=".8"/>`).join('');
const wrap = s => `<svg viewBox="-100 -100 200 200" aria-hidden="true"><circle r="94" fill="rgba(255,255,255,.3)"/>${s}</svg>`;

const peonia = wrap(
  P("M0 0C-26-8-34-46 0-62C34-46 26-8 0 0Z",10,1.4,0,'#f4c9d3') +
  P("M0 0C-26-8-34-46 0-62C34-46 26-8 0 0Z",9,1.15,20,'#ecaebe') +
  P("M0 0C-26-8-34-46 0-62C34-46 26-8 0 0Z",8,.9,10,'#e497ab') +
  P("M0 0C-26-8-34-46 0-62C34-46 26-8 0 0Z",7,.65,30,'#d97d98') +
  P("M0 0C-26-8-34-46 0-62C34-46 26-8 0 0Z",6,.4,0,'#c96282') +
  '<circle r="5" fill="#f1cf92"/>'
);

const stamens = Array.from({length:14},(_,i)=>`<g transform="rotate(${i*360/14+6})"><line y1="-8" y2="-34" stroke="#d9718f" stroke-width="1"/><circle cy="-34" r="2.4" fill="#b84b6c"/></g>`).join('');
const cerejeira = wrap(
  P("M0 0C-26-18-30-52-9-62L0-52L9-62C30-52 26-18 0 0Z",5,1.45,0,'#f9d6de') +
  Array.from({length:5},(_,i)=>`<line y1="-8" y2="-52" transform="rotate(${i*72})" stroke="#e58fa6" stroke-width="1.3" opacity=".6"/>`).join('') +
  '<circle r="10" fill="#e8a0b4"/>' + stamens + '<circle r="4" fill="#c4577a"/>'
);

const dalia = wrap(
  P("M0 0C-9-14-11-40 0-62C11-40 9-14 0 0Z",18,1.45,0,'#f1bcc9') +
  P("M0 0C-9-14-11-40 0-62C11-40 9-14 0 0Z",16,1.2,10,'#ea9fb3') +
  P("M0 0C-9-14-11-40 0-62C11-40 9-14 0 0Z",14,.95,4,'#e0849f') +
  P("M0 0C-9-14-11-40 0-62C11-40 9-14 0 0Z",12,.7,14,'#d46b8b') +
  P("M0 0C-9-14-11-40 0-62C11-40 9-14 0 0Z",9,.45,0,'#c25277') +
  '<circle r="5" fill="#f2d79a"/>'
);

// Aqui você também pode trocar as frases de cada flor.
const flores = [
  {nome:'Peônia', svg:peonia, frase:'Obrigado por ter feito minha vida ter cor de novo.'},
  {nome:'Flor de cerejeira', svg:cerejeira, frase:'Sou tão grato que nem qualquer ato seja suficiente para demonstrar o quanto te amo.'},
  {nome:'Dália', svg:dalia, frase:'E sou muito feliz com você, e agradeço todos os dias por te ter', final:true}
];

/* ---------- Carrossel ---------- */
const $ = s => document.querySelector(s);
const flor=$('#flor'), card=$('#card'), dots=$('#dots'), dica=$('#dica');
let i = 0;
flores.forEach(()=>dots.appendChild(document.createElement('i')));

function mostra(dir){
  const f = flores[i];
  flor.innerHTML = f.svg;
  flor.setAttribute('aria-label', f.nome + ', toque para ver a mensagem');
  flor.className = 'flor';
  void flor.offsetWidth;
  flor.classList.add(dir < 0 ? 'inb' : 'in');
  [...dots.children].forEach((d,k)=>d.classList.toggle('on', k===i));
  card.hidden = true;
}
function vai(d){ i = (i + d + flores.length) % flores.length; mostra(d); }
$('#volta').onclick = () => vai(-1);
$('#avanca').onclick = () => vai(1);

flor.onclick = () => {
  const f = flores[i];
  card.innerHTML = `<div class="mini">${f.svg}</div><p class="t">${f.frase}</p>` +
    (f.final ? `<p class="q">Quer ver uma flor mais bonita que essas?</p><button class="go" id="mostrar">Mostrar</button>` : '');
  card.hidden = false;
  dica.hidden = true;
  flor.classList.remove('in','inb'); flor.classList.add('flo');
  card.scrollIntoView({behavior:'smooth', block:'nearest'});
  const b = $('#mostrar');
  if (b) b.onclick = revela;
};

/* ---------- Cena final ---------- */
function revela(){
  $('#main').classList.add('out');
  setTimeout(()=>{ $('#main').hidden = true; $('#final').classList.add('on'); $('#final').removeAttribute('aria-hidden'); }, 700);
}
const foto=$('#foto'), fcr=$('#fcr');
// A foto aparece inteira, sem corte e sem moldura, no meio do coração.
function poeFoto(src){
  if(!src) return;
  const im = new Image();
  im.onload = () => {
    const MW=110, MH=90, cx=100, cy=81;
    const k = Math.min(MW/im.naturalWidth, MH/im.naturalHeight);
    const w = im.naturalWidth*k, h = im.naturalHeight*k, x = cx-w/2, y = cy-h/2;
    [foto, fcr].forEach(el => {
      el.setAttribute('x', x); el.setAttribute('y', y);
      el.setAttribute('width', w); el.setAttribute('height', h);
    });
    foto.setAttribute('href', src);
    foto.style.display = '';
  };
  im.src = src;
}
